<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dikran Teymur — Games</title>
<meta name="description" content="Small, calm puzzle games for iPhone and Android.">
<style>
  :root { --bg: #fbf8f3; --ink: #2b2620; --muted: #6f665b; --line: #e6dfd3; --card: #ffffff; --accent: #b4562f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a17; --ink: #ece6dc; --muted: #a59c90; --line: #35312b; --card: #24211d; --accent: #e08a5f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 32px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 0 0 16px; }
  .game p { margin: 0 0 12px; color: var(--muted); }
  .links a { margin-right: 16px; white-space: nowrap; }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Dikran Teymur — Games</h1>
  <p class="meta">Small, calm puzzle games for iPhone and Android.</p>

  <section class="game">
    <h2>Tilted Shelf <span lang="tr">(Eğik Raf)</span></h2>
    <p>Tilt the shelves and slide every item onto its spot.</p>

  </section>

  <section class="game">
    <h2>Sliding Penguins</h2>
    <div class="links">
      <a href="penguin-slide-privacy/">Privacy Policy</a>
      <a href="penguin-slide-privacy/support.html">Support</a>
      <a href="penguin-slide-privacy/terms.html">Terms of Use</a>
    </div>
  </section>

  <footer>Contact: <a href="mailto:mdtsoftware21@gmail.com">mdtsoftware21@gmail.com</a></footer>
</main>
</body>
</html>
